<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strange Plants Word Challenge 🎯</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: linear-gradient(135deg, #56ab2f 0%, #a8e063 100%); min-height: 100vh; display: flex; justify-content: center; align-items: center; }
        .container { width: 95%; max-width: 700px; background: #1a2e1a; border-radius: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.5); overflow: hidden; min-height: 550px; display: flex; flex-direction: column; color: white; }
        .start-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 550px; gap: 20px; padding: 30px; }
        .start-screen h1 { font-size: 34px; color: #a8e063; }
        .start-screen p { font-size: 16px; color: #aaa; }
        .start-btn { background: linear-gradient(135deg, #a8e063, #56ab2f); color: #1a2e1a; border: none; padding: 18px 50px; border-radius: 50px; font-size: 22px; font-weight: bold; cursor: pointer; box-shadow: 0 8px 25px rgba(86,171,47,0.4); transition: transform 0.2s; }
        .start-btn:hover { transform: scale(1.05); }
        .game-screen { display: none; flex-direction: column; height: 550px; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; padding: 15px 25px; background: rgba(255,255,255,0.05); }
        .question-num { font-size: 16px; font-weight: bold; color: #a8e063; }
        .timer-area { display: flex; flex-direction: column; align-items: center; }
        .timer-ring { width: 60px; height: 60px; position: relative; }
        .timer-ring svg { transform: rotate(-90deg); }
        .timer-ring circle { fill: none; stroke-width: 5; }
        .timer-bg { stroke: rgba(255,255,255,0.1); }
        .timer-progress { stroke: #a8e063; stroke-dasharray: 157; stroke-dashoffset: 0; transition: stroke-dashoffset 1s linear, stroke 0.3s; stroke-linecap: round; }
        .timer-text { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 22px; font-weight: 900; color: #a8e063; }
        .score-bar { font-size: 16px; font-weight: bold; color: #ffd54f; }
        .streak { text-align: center; font-size: 16px; font-weight: bold; color: #ff9800; padding: 8px; display: none; animation: flashIn 0.3s; }
        @keyframes flashIn { 0% { opacity: 0; transform: scale(0.5); } 100% { opacity: 1; transform: scale(1); } }
        .question-area { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; gap: 8px; }
        .question-icon { font-size: 50px; }
        .question-word { font-size: 38px; font-weight: 900; color: #fff; text-shadow: 0 0 20px rgba(168,224,99,0.5); }
        .speak-btn { background: none; border: 2px solid #a8e063; color: #a8e063; padding: 8px 20px; border-radius: 30px; font-size: 14px; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .speak-btn:hover { background: #a8e063; color: #1a2e1a; }
        .question-hint { font-size: 14px; color: #888; }
        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 10px 25px 25px; }
        .option-btn { border: none; padding: 18px 12px; border-radius: 12px; font-size: 17px; font-weight: 700; cursor: pointer; color: white; transition: transform 0.15s, opacity 0.15s; text-align: center; min-height: 60px; display: flex; align-items: center; justify-content: center; }
        .option-btn:hover { transform: scale(1.03); }
        .option-btn:active { transform: scale(0.97); }
        .option-btn.disabled { opacity: 0.4; pointer-events: none; }
        .opt-red { background: #e53935; }
        .opt-blue { background: #1e88e5; }
        .opt-yellow { background: #fdd835; color: #333; }
        .opt-green { background: #43a047; }
        .option-btn.correct { background: #43a047 !important; transform: scale(1.08); animation: pop 0.3s; box-shadow: 0 0 20px rgba(67,160,71,0.6); }
        .option-btn.wrong { background: #555 !important; transform: scale(0.95); }
        @keyframes pop { 0% { transform: scale(1); } 50% { transform: scale(1.15); } 100% { transform: scale(1.08); } }
        .result-screen { display: none; flex-direction: column; align-items: center; justify-content: center; height: 550px; gap: 15px; padding: 30px; }
        .result-emoji { font-size: 80px; }
        .result-title { font-size: 28px; font-weight: 900; color: #a8e063; }
        .result-score { font-size: 52px; font-weight: 900; color: #fff; }
        .result-detail { font-size: 16px; color: #aaa; margin-bottom: 5px; }
        .result-stats { display: flex; gap: 15px; margin: 10px 0; }
        .stat-box { text-align: center; padding: 12px 18px; background: rgba(255,255,255,0.08); border-radius: 12px; }
        .stat-num { font-size: 28px; font-weight: 900; }
        .stat-label { font-size: 12px; color: #888; }
        .stat-correct .stat-num { color: #43a047; }
        .stat-wrong .stat-num { color: #e53935; }
        .stat-streak .stat-num { color: #a8e063; }
        .retry-btn { background: linear-gradient(135deg, #a8e063, #56ab2f); color: #1a2e1a; border: none; padding: 15px 40px; border-radius: 50px; font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <div class="start-screen" id="startScreen">
        <div style="font-size: 60px;">🌵</div>
        <h1>Strange Plants Challenge</h1>
        <p>20 words, 20 seconds each. How many can you get?</p>
        <button class="start-btn" onclick="startGame()">START 🚀</button>
    </div>

    <div class="game-screen" id="gameScreen">
        <div class="top-bar">
            <span class="question-num" id="questionNum">Q 1 / 20</span>
            <div class="timer-area">
                <div class="timer-ring">
                    <svg width="60" height="60"><circle class="timer-bg" cx="30" cy="30" r="25"/><circle class="timer-progress" id="timerCircle" cx="30" cy="30" r="25"/></svg>
                    <div class="timer-text" id="timer">20</div>
                </div>
            </div>
            <span class="score-bar" id="scoreBar">⭐ 0</span>
        </div>
        <div class="streak" id="streak"></div>
        <div class="question-area">
            <div class="question-icon" id="questionIcon">🌵</div>
            <div class="question-word" id="questionWord">cactus</div>
            <button class="speak-btn" onclick="speakWord()">🔊 Listen</button>
            <div class="question-hint">Choose the correct meaning</div>
        </div>
        <div class="options-grid" id="optionsGrid"></div>
    </div>

    <div class="result-screen" id="resultScreen">
        <div class="result-emoji" id="resultEmoji">🏆</div>
        <div class="result-title" id="resultTitle">Challenge Complete!</div>
        <div class="result-score" id="resultScore">0 / 20</div>
        <div class="result-stats">
            <div class="stat-box stat-correct"><div class="stat-num" id="statCorrect">0</div><div class="stat-label">Correct</div></div>
            <div class="stat-box stat-wrong"><div class="stat-num" id="statWrong">0</div><div class="stat-label">Wrong</div></div>
            <div class="stat-box stat-streak"><div class="stat-num" id="statStreak">0</div><div class="stat-label">Best Streak</div></div>
        </div>
        <div class="result-detail" id="resultDetail"></div>
        <button class="retry-btn" onclick="startGame()">Play Again 🔄</button>
    </div>
</div>

<script>
var words = [
    { word: "cactus", zh: "a plant with spines", icon: "🌵" },
    { word: "daisies", zh: "flowers with white petals", icon: "🌼" },
    { word: "buried", zh: "put under the ground", icon: "🌱" },
    { word: "branches", zh: "parts growing from a tree", icon: "🌿" },
    { word: "moisture", zh: "small amount of water", icon: "💧" },
    { word: "flytrap", zh: "a plant that catches insects", icon: "🪤" },
    { word: "swamp trees", zh: "trees in wet land", icon: "🌳" },
    { word: "traps", zh: "things that catch animals", icon: "🪤" },
    { word: "spikes", zh: "sharp points", icon: "📌" },
    { word: "critter", zh: "a small animal", icon: "🐛" },
    { word: "sundew", zh: "a sticky meat-eating plant", icon: "🪴" },
    { word: "stuck", zh: "unable to move", icon: "🔒" },
    { word: "digests", zh: "turns food into energy", icon: "🔄" },
    { word: "rootlike", zh: "looking like roots", icon: "🌿" },
    { word: "parasite", zh: "a plant that lives on others", icon: "🦠" },
    { word: "attract", zh: "to draw near", icon: "🧲" },
    { word: "shrubs", zh: "small bushes", icon: "🌿" },
    { word: "cracks", zh: "small breaks in rock", icon: "🪨" },
    { word: "stem", zh: "the main part of a plant", icon: "🌱" },
    { word: "orchids", zh: "beautiful flowers", icon: "🌸" }
];

var questions = [];
var currentQ = 0;
var score = 0;
var streak = 0;
var maxStreak = 0;
var correctCount = 0;
var timer = null;
var musicTimer = null;
var timeLeft = 20;
var audioCtx = null;

function getAudioCtx() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    return audioCtx;
}

function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
}

function speak(text) {
    if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        var u = new SpeechSynthesisUtterance(text);
        u.lang = 'en-US';
        u.rate = 0.85;
        window.speechSynthesis.speak(u);
    }
}

function speakWord() { speak(questions[currentQ].word); }

function startCountdownMusic() {
    stopCountdownMusic();
    var ctx = getAudioCtx();
    function playBeat() {
        if (timeLeft <= 0) return;
        var osc = ctx.createOscillator();
        var gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        if (timeLeft > 12) {
            osc.frequency.value = 80; gain.gain.value = 0.15;
            osc.start(); osc.stop(ctx.currentTime + 0.1);
            musicTimer = setTimeout(playBeat, 800);
        } else if (timeLeft > 6) {
            osc.frequency.value = 100; gain.gain.value = 0.2;
            osc.start(); osc.stop(ctx.currentTime + 0.08);
            musicTimer = setTimeout(playBeat, 400);
        } else if (timeLeft > 0) {
            osc.frequency.value = 120; gain.gain.value = 0.25;
            osc.start(); osc.stop(ctx.currentTime + 0.06);
            var osc2 = ctx.createOscillator(); var gain2 = ctx.createGain();
            osc2.connect(gain2); gain2.connect(ctx.destination);
            osc2.frequency.value = 130; gain2.gain.value = 0.2;
            osc2.start(ctx.currentTime + 0.08); osc2.stop(ctx.currentTime + 0.14);
            musicTimer = setTimeout(playBeat, 250);
        }
    }
    playBeat();
}

function stopCountdownMusic() { if (musicTimer) { clearTimeout(musicTimer); musicTimer = null; } }

function playCorrectSound() {
    var ctx = getAudioCtx();
    [523, 659, 784].forEach(function(f, i) {
        var osc = ctx.createOscillator(); var g = ctx.createGain();
        osc.connect(g); g.connect(ctx.destination);
        osc.frequency.value = f; g.gain.value = 0.2;
        osc.start(ctx.currentTime + i * 0.1); osc.stop(ctx.currentTime + i * 0.1 + 0.15);
    });
}

function playWrongSound() {
    var ctx = getAudioCtx();
    var osc = ctx.createOscillator(); var g = ctx.createGain();
    osc.connect(g); g.connect(ctx.destination);
    osc.frequency.value = 200; g.gain.value = 0.2;
    osc.start(); osc.frequency.linearRampToValueAtTime(120, ctx.currentTime + 0.3);
    osc.stop(ctx.currentTime + 0.35);
}

function playTimeUpSound() {
    var ctx = getAudioCtx();
    [400, 350, 300].forEach(function(f, i) {
        var osc = ctx.createOscillator(); var g = ctx.createGain();
        osc.connect(g); g.connect(ctx.destination);
        osc.frequency.value = f; g.gain.value = 0.2;
        osc.start(ctx.currentTime + i * 0.12); osc.stop(ctx.currentTime + i * 0.12 + 0.1);
    });
}

function startGame() {
    questions = shuffle(words);
    currentQ = 0; score = 0; streak = 0; maxStreak = 0; correctCount = 0;
    document.getElementById('startScreen').style.display = 'none';
    document.getElementById('resultScreen').style.display = 'none';
    document.getElementById('gameScreen').style.display = 'flex';
    loadQuestion();
}

function loadQuestion() {
    var q = questions[currentQ];
    document.getElementById('questionNum').innerText = 'Q ' + (currentQ + 1) + ' / ' + questions.length;
    document.getElementById('scoreBar').innerText = '⭐ ' + score;
    document.getElementById('questionIcon').innerText = q.icon;
    document.getElementById('questionWord').innerText = q.word;
    var streakEl = document.getElementById('streak');
    if (streak >= 3) { streakEl.style.display = 'block'; streakEl.innerText = '🔥 ' + streak + ' in a row!'; }
    else { streakEl.style.display = 'none'; }
    var options = [q.zh];
    var others = words.filter(function(w) { return w.zh !== q.zh; });
    others = shuffle(others);
    for (var i = 0; i < 3 && i < others.length; i++) { options.push(others[i].zh); }
    options = shuffle(options);
    var colors = ['opt-red', 'opt-blue', 'opt-yellow', 'opt-green'];
    var grid = document.getElementById('optionsGrid');
    grid.innerHTML = '';
    for (var j = 0; j < options.length; j++) {
        var btn = document.createElement('button');
        btn.className = 'option-btn ' + colors[j];
        btn.innerText = options[j];
        btn.setAttribute('data-answer', options[j]);
        btn.onclick = function() { checkAnswer(this); };
        grid.appendChild(btn);
    }
    setTimeout(function() { speak(q.word); }, 300);
    timeLeft = 20;
    document.getElementById('timer').innerText = timeLeft;
    document.getElementById('timerCircle').style.strokeDashoffset = '0';
    document.getElementById('timerCircle').style.stroke = '#a8e063';
    clearInterval(timer);
    startCountdownMusic();
    timer = setInterval(function() {
        timeLeft--;
        document.getElementById('timer').innerText = timeLeft;
        var offset = 157 - (157 * (20 - timeLeft) / 20);
        document.getElementById('timerCircle').style.strokeDashoffset = offset;
        if (timeLeft <= 7) { document.getElementById('timerCircle').style.stroke = '#e53935'; }
        if (timeLeft <= 0) { clearInterval(timer); stopCountdownMusic(); playTimeUpSound(); timeUp(); }
    }, 1000);
}

function timeUp() {
    streak = 0;
    var q = questions[currentQ];
    var btns = document.querySelectorAll('.option-btn');
    btns.forEach(function(btn) { btn.classList.add('disabled'); if (btn.getAttribute('data-answer') === q.zh) btn.classList.add('correct'); });
    setTimeout(nextQuestion, 1500);
}

function checkAnswer(btn) {
    clearInterval(timer); stopCountdownMusic();
    var answer = btn.getAttribute('data-answer');
    var q = questions[currentQ];
    var btns = document.querySelectorAll('.option-btn');
    btns.forEach(function(b) { b.classList.add('disabled'); });
    if (answer === q.zh) {
        btn.classList.add('correct');
        var bonus = timeLeft >= 14 ? 15 : timeLeft >= 7 ? 10 : 5;
        score += bonus; streak++; correctCount++;
        if (streak > maxStreak) maxStreak = streak;
        playCorrectSound();
    } else {
        btn.classList.add('wrong'); streak = 0;
        btns.forEach(function(b) { if (b.getAttribute('data-answer') === q.zh) b.classList.add('correct'); });
        playWrongSound();
    }
    document.getElementById('scoreBar').innerText = '⭐ ' + score;
    setTimeout(nextQuestion, 1500);
}

function nextQuestion() { currentQ++; if (currentQ >= questions.length) { showResult(); } else { loadQuestion(); } }

function showResult() {
    stopCountdownMusic();
    document.getElementById('gameScreen').style.display = 'none';
    document.getElementById('resultScreen').style.display = 'flex';
    document.getElementById('statCorrect').innerText = correctCount;
    document.getElementById('statWrong').innerText = questions.length - correctCount;
    document.getElementById('statStreak').innerText = maxStreak;
    document.getElementById('resultScore').innerText = correctCount + ' / ' + questions.length;
    if (correctCount === 20) {
        document.getElementById('resultEmoji').innerText = '👑';
        document.getElementById('resultTitle').innerText = 'PERFECT!';
        document.getElementById('resultDetail').innerText = 'You are the Plant Expert!';
        setTimeout(function() { speak('Perfect! You are the Plant Expert!'); }, 500);
    } else if (correctCount >= 15) {
        document.getElementById('resultEmoji').innerText = '🎉';
        document.getElementById('resultTitle').innerText = 'GREAT JOB!';
        document.getElementById('resultDetail').innerText = 'Almost there, keep going!';
        setTimeout(function() { speak('Great job!'); }, 500);
    } else if (correctCount >= 10) {
        document.getElementById('resultEmoji').innerText = '💪';
        document.getElementById('resultTitle').innerText = 'NOT BAD!';
        document.getElementById('resultDetail').innerText = 'Practice a few more times!';
        setTimeout(function() { speak('Not bad!'); }, 500);
    } else {
        document.getElementById('resultEmoji').innerText = '📖';
        document.getElementById('resultTitle').innerText = 'KEEP TRYING!';
        document.getElementById('resultDetail').innerText = 'Review the words and come back!';
        setTimeout(function() { speak('Keep trying!'); }, 500);
    }
}
</script>
</body>
</html>
